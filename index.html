<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<meta name="description"
      content="JS-INNOVATECH - Tecnologia, assistência técnica, peças e soluções digitais.">

<title>JS-INNOVATECH | Tecnologia e Inovação</title>


<style>

/* =========================================================
RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Arial, Helvetica, sans-serif;
    background:#05070d;
    color:#fff;
    overflow-x:hidden;
}

button,
input{
    font-family:inherit;
}

button{
    cursor:pointer;
}

a{
    color:inherit;
}


/* =========================================================
TOPO
========================================================= */

.topo{
    background:#080c14;
    border-bottom:1px solid #151a25;
    padding:9px 6%;
    color:#8f99a8;
    font-size:13px;
    text-align:center;
}

.topo span{
    color:#00aaff;
    font-weight:bold;
}


/* =========================================================
HEADER — ESTILO SAMSUNG / DARK
========================================================= */

header{
    height:72px;

    background:#05070d;

    padding:0 5%;

    display:flex;
    align-items:center;

    gap:24px;

    position:sticky;
    top:0;

    z-index:3000;

    border-bottom:1px solid #151a25;
}


/* =========================================================
LOGO
========================================================= */

.logo{
    font-size:23px;

    font-weight:bold;

    white-space:nowrap;

    display:flex;
    align-items:center;

    line-height:1;

    letter-spacing:-.5px;
}

.logo span{
    color:#00aaff;
}


/* =========================================================
PESQUISA
========================================================= */

.pesquisa{
    flex:1;

    max-width:650px;

    position:relative;

    margin-left:auto;
}

.pesquisa input{
    width:100%;

    height:44px;

    padding:0 55px 0 18px;

    border:1px solid #202b3c;

    outline:none;

    border-radius:24px;

    background:#111722;

    color:#fff;

    font-size:14px;

    transition:.2s;
}

.pesquisa input::placeholder{
    color:#778293;
}

.pesquisa input:focus{
    border-color:#00aaff;

    box-shadow:
        0 0 0 2px rgba(0,170,255,.08);
}


/* =========================================================
BOTÃO PESQUISA
========================================================= */

.pesquisa button{
    position:absolute;

    right:0;
    top:0;

    width:48px;
    height:44px;

    border:0;

    background:transparent;

    color:#fff;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    transition:.2s;
}

.pesquisa button:hover{
    color:#00aaff;
}


/* =========================================================
SVG DOS ÍCONES
========================================================= */

.pesquisa button svg,
.header-icon svg,
.menu svg{
    width:27px;
    height:27px;

    fill:none;

    stroke:currentColor;

    stroke-width:1.7;

    stroke-linecap:round;

    stroke-linejoin:round;
}


/* =========================================================
ÍCONE CONTA / HEADER
========================================================= */

.header-icons{
    display:flex;

    align-items:center;

    gap:6px;

    height:50px;
}

.header-icon{
    width:48px;
    height:48px;

    display:flex;

    align-items:center;
    justify-content:center;

    color:#fff;

    cursor:pointer;

    border-radius:50%;

    transition:.2s;

    position:relative;
}

.header-icon:hover{
    color:#00aaff;

    background:#111722;
}


/* =========================================================
MENU HAMBÚRGUER
========================================================= */

.menu{
    width:48px;
    height:48px;

    border:0;

    background:transparent;

    color:#fff;

    border-radius:50%;

    display:flex;

    align-items:center;
    justify-content:center;

    flex-shrink:0;

    transition:.2s;
}

.menu:hover{
    color:#00aaff;

    background:#111722;
}


/* =========================================================
CONTA LOGADA
========================================================= */

.conta-logada{
    position:relative;

    display:none;
}

.conta-logada.ativa{
    display:block;
}

.conta-botao{
    width:48px;
    height:48px;

    background:transparent;

    border:0;

    color:#fff;

    display:flex;

    align-items:center;
    justify-content:center;

    border-radius:50%;

    transition:.2s;
}

.conta-botao:hover{
    color:#00aaff;

    background:#111722;
}

.conta-botao svg{
    width:27px;
    height:27px;

    fill:none;

    stroke:currentColor;

    stroke-width:1.7;

    stroke-linecap:round;

    stroke-linejoin:round;
}


/* =========================================================
PAINEL DA CONTA
========================================================= */

.conta-painel{
    display:none;

    position:absolute;

    top:58px;

    right:0;

    width:300px;

    background:#0b0f18;

    border:1px solid #00aaff;

    border-radius:14px;

    padding:22px;

    box-shadow:
        0 15px 50px rgba(0,0,0,.7);

    z-index:6000;
}

.conta-painel.ativo{
    display:block;
}

.conta-cabecalho{
    text-align:center;

    padding-bottom:18px;

    border-bottom:1px solid #202b3c;

    margin-bottom:18px;
}

.conta-avatar{
    width:65px;
    height:65px;

    margin:0 auto 10px;

    border-radius:50%;

    background:#003d66;

    border:1px solid #00aaff;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:30px;
}

.conta-status{
    color:#00aaff;

    font-size:12px;

    margin-top:5px;
}

.dado-conta{
    margin-bottom:15px;
}

.dado-conta small{
    display:block;

    color:#778293;

    margin-bottom:5px;
}

.dado-conta span{
    display:block;

    background:#111722;

    border:1px solid #202b3c;

    border-radius:7px;

    padding:10px;

    color:#fff;

    font-size:13px;

    word-break:break-word;
}

.botao-sair{
    width:100%;

    padding:11px;

    border:none;

    border-radius:7px;

    background:#d93030;

    color:#fff;

    font-weight:bold;
}

.botao-sair:hover{
    background:#b92323;
}


/* =========================================================
MENU LATERAL
========================================================= */

.menu-dropdown{
    position:fixed;

    top:0;
    left:0;

    width:390px;
    max-width:100vw;

    height:100vh;

    background:#0b0f18;

    border-right:1px solid #00aaff;

    padding:0;

    display:block;

    transform:translateX(-105%);

    transition:
        transform .3s ease;

    box-shadow:
        15px 0 50px rgba(0,0,0,.65);

    overflow-y:auto;

    z-index:9000;
}

.menu-dropdown.ativo{
    transform:translateX(0);
}


/* =========================================================
CABEÇALHO MENU
========================================================= */

.menu-mobile-top{
    min-height:90px;

    background:#05070d;

    border-bottom:1px solid #202b3c;

    padding:20px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    position:sticky;

    top:0;

    z-index:5;
}

.menu-mobile-logo{
    font-size:21px;

    font-weight:bold;
}

.menu-mobile-logo span{
    color:#00aaff;
}

.menu-fechar{
    width:42px;
    height:42px;

    border:1px solid #263347;

    background:#111722;

    color:#fff;

    border-radius:8px;

    font-size:28px;

    line-height:1;

    transition:.2s;
}

.menu-fechar:hover{
    border-color:#00aaff;

    color:#00aaff;
}


/* =========================================================
CONTA NO MENU
========================================================= */

.menu-conta{
    padding:25px 20px 18px;

    display:flex;

    align-items:center;

    gap:15px;

    background:#0b0f18;

    border-bottom:1px solid #202b3c;
}

.menu-avatar{
    width:62px;
    height:62px;

    flex-shrink:0;

    border-radius:50%;

    background:#003d66;

    border:1px solid #00aaff;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:30px;
}

.menu-conta-texto{
    display:flex;

    flex-direction:column;

    gap:5px;
}

.menu-conta-texto strong{
    font-size:19px;

    color:#fff;
}

.menu-conta-texto span{
    color:#8994a5;

    font-size:13px;

    line-height:1.45;
}


/* =========================================================
BOTÕES CONTA
========================================================= */

.menu-conta-botoes{
    display:flex;

    gap:8px;

    padding:15px 20px 22px;

    background:#0b0f18;

    border-bottom:8px solid #05070d;
}

.menu-conta-botoes button{
    flex:1;

    min-height:45px;

    border-radius:7px;

    font-size:14px;

    font-weight:bold;

    transition:.2s;
}

.menu-btn-entrar{
    border:none;

    background:#00aaff;

    color:#fff;
}

.menu-btn-entrar:hover{
    background:#008dcc;
}

.menu-btn-cadastro{
    background:#111722;

    border:1px solid #00aaff;

    color:#00aaff;
}

.menu-btn-cadastro:hover{
    background:#003d66;
}


/* =========================================================
ITENS MENU
========================================================= */

.menu-itens{
    background:#0b0f18;

    border-bottom:8px solid #05070d;
}

.menu-itens a,
.menu-secao a,
.menu-admin-area a{
    min-height:64px;

    display:flex;

    align-items:center;

    gap:17px;

    padding:0 22px;

    text-decoration:none;

    color:#c1cad6;

    font-size:16px;

    border-bottom:1px solid #171e2b;

    transition:.2s;
}

.menu-itens a:hover,
.menu-secao a:hover,
.menu-admin-area a:hover{
    background:#111722;

    color:#00aaff;
}

.menu-item-icon{
    width:28px;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:23px;

    flex-shrink:0;
}


/* =========================================================
CATEGORIAS MENU
========================================================= */

.menu-secao{
    background:#0b0f18;

    border-bottom:8px solid #05070d;

    padding-bottom:10px;
}

.menu-secao-titulo{
    padding:22px;

    font-size:18px;

    font-weight:bold;

    color:#fff;

    border-bottom:1px solid #202b3c;
}

.menu-admin-area{
    background:#0b0f18;

    padding-bottom:30px;
}


/* =========================================================
OVERLAY
========================================================= */

.menu-dropdown::after{
    content:"";

    position:fixed;

    top:0;

    left:390px;

    width:100vw;

    height:100vh;

    background:rgba(0,0,0,.60);

    pointer-events:none;
}


/* =========================================================
INFO BAR
========================================================= */

.info-bar{
    background:#080c14;

    padding:12px 5%;

    display:flex;

    gap:30px;

    align-items:center;

    border-bottom:1px solid #171e2b;

    font-size:13px;

    overflow-x:auto;

    white-space:nowrap;
}

.info-item{
    color:#aeb7c5;

    flex-shrink:0;
}

.info-item span{
    color:#00aaff;

    font-weight:bold;
}


/* =========================================================
HERO
========================================================= */

.hero{
    padding:35px 6%;

    background:
        radial-gradient(
            circle at 85% 40%,
            #003d66,
            #05070d 55%
        );
}

.hero-carousel{
    position:relative;

    overflow:hidden;

    border-radius:18px;
}

.hero-slides{
    display:flex;

    transition:transform .6s ease;

    will-change:transform;
}

.hero-box{
    min-width:100%;

    min-height:430px;

    border:1px solid #12354b;

    border-radius:18px;

    padding:55px;

    display:flex;

    justify-content:space-between;

    align-items:center;

    overflow:hidden;

    background:
        linear-gradient(
            100deg,
            rgba(0,170,255,.10),
            rgba(5,7,13,.8)
        );
}

.hero-text{
    max-width:650px;
}

.hero-small{
    color:#00aaff;

    font-size:13px;

    font-weight:bold;

    letter-spacing:3px;

    margin-bottom:18px;
}

.hero h1{
    font-size:50px;

    line-height:1.1;

    margin-bottom:20px;
}

.hero h1 span{
    color:#00aaff;
}

.hero p{
    color:#aeb7c5;

    font-size:17px;

    line-height:1.7;

    max-width:600px;
}

.hero-button{
    display:inline-block;

    margin-top:28px;

    padding:15px 26px;

    border-radius:8px;

    background:#00aaff;

    color:#fff;

    text-decoration:none;

    font-weight:bold;

    transition:.3s;
}

.hero-button:hover{
    transform:translateY(-3px);

    background:#008dcc;
}

.hero-icon{
    width:240px;
    height:240px;

    border:1px solid #00aaff;

    border-radius:25px;

    display:flex;

    align-items:center;
    justify-content:center;

    font-size:90px;

    background:rgba(0,170,255,.06);

    box-shadow:
        0 0 60px rgba(0,170,255,.15);

    flex-shrink:0;
}


/* =========================================================
CARROSSEL
========================================================= */

.carousel-btn{
    position:absolute;

    top:50%;

    transform:translateY(-50%);
